<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Колесо Фортуни</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    background: #000;
    color: #fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    overflow-x: hidden;
  }
  h1 {
    font-size: 2.2rem;
    margin-bottom: 20px;
    text-align: center;
    color: #FF8C00;
    text-shadow: 0 0 10px rgba(255, 140, 0, 0.5);
  }
  .wheel-container {
    position: relative;
    width: 420px;
    height: 420px;
    margin: 20px auto;
  }
  canvas {
    border-radius: 50%;
    box-shadow: 0 0 40px rgba(255, 140, 0, 0.4);
  }
  .pointer {
    position: absolute;
    top: -15px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 35px solid #FF8C00;
    z-index: 10;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6));
  }
  button {
    margin-top: 25px;
    padding: 16px 48px;
    font-size: 1.4rem;
    font-weight: bold;
    background: linear-gradient(135deg, #FF8C00, #FF6B00);
    color: #000;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 15px rgba(255, 140, 0, 0.4);
  }
  button:hover:not(:disabled) {
    transform: scale(1.05);
    box-shadow: 0 6px 20px rgba(255, 140, 0, 0.6);
  }
  button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }
  .result {
    margin-top: 30px;
    max-width: 700px;
    text-align: center;
    min-height: 120px;
    padding: 20px;
  }
  .result .number {
    font-size: 3rem;
    font-weight: bold;
    color: #FF8C00;
    margin-bottom: 10px;
  }
  .result .question {
    font-size: 1.35rem;
    line-height: 1.5;
    color: #fff;
  }
  .result.hidden {
    opacity: 0;
  }
  @media (max-width: 480px) {
    .wheel-container {
      width: 320px;
      height: 320px;
    }
    h1 { font-size: 1.6rem; }
    .result .question { font-size: 1.1rem; }
  }
</style>
</head>
<body>
  <h1>Колесо Фортуни</h1>
  <div class="wheel-container">
    <div class="pointer"></div>
    <canvas id="wheel" width="420" height="420"></canvas>
  </div>
  <button id="spinBtn">Крутити колесо</button>
  <div class="result" id="result">
    <div class="number" id="resultNumber"></div>
    <div class="question" id="resultQuestion"></div>
  </div>

<script>
const questions = [
  "Якби ти міг/могла на один день помінятися професією з будь-ким, ким би став/стала?",
  "Якби гроші були не важливі, ким би ти працював?",
  "Яка твоя найбільш несподівана навичка?",
  "Який фільм ти можеш передивлятися нескінченно?",
  "Якби завтра тобі дали квиток у будь-яку точку світу, куди б ти полетів/полетіла?",
  "Яка найбезглуздіша покупка у твоєму житті?",
  "Якби можна було додати одну дивну корпоративну традицію, що б це було?",
  "Яку їжу ти міг/могла б їсти тиждень без перерви?",
  "Якби можна було на один день помінятися життям із будь-якою людиною, кого б обрав/обрала?",
  "Одне питання тобі чи два наступному?"
];

const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const spinBtn = document.getElementById('spinBtn');
const resultDiv = document.getElementById('result');
const resultNumber = document.getElementById('resultNumber');
const resultQuestion = document.getElementById('resultQuestion');

const segments = 10;
const segmentAngle = (2 * Math.PI) / segments;
const colors = ['#FFFFFF', '#FF8C00'];
let currentRotation = 0;
let isSpinning = false;

function drawWheel(rotation = 0) {
  const centerX = canvas.width / 2;
  const centerY = canvas.height / 2;
  const radius = canvas.width / 2 - 10;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = 0; i < segments; i++) {
    const startAngle = i * segmentAngle + rotation - Math.PI / 2;
    const endAngle = startAngle + segmentAngle;

    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.arc(centerX, centerY, radius, startAngle, endAngle);
    ctx.closePath();
    ctx.fillStyle = colors[i % 2];
    ctx.fill();
    ctx.strokeStyle = '#111';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Номер
    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.rotate(startAngle + segmentAngle / 2);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = (i % 2 === 0) ? '#111' : '#fff';
    ctx.font = 'bold 28px Arial';
    ctx.fillText((i + 1).toString(), radius * 0.65, 0);
    ctx.restore();
  }

  // Центральний кружок
  ctx.beginPath();
  ctx.arc(centerX, centerY, 28, 0, 2 * Math.PI);
  ctx.fillStyle = '#111';
  ctx.fill();
  ctx.strokeStyle = '#FF8C00';
  ctx.lineWidth = 4;
  ctx.stroke();
}

function getWinner(rotation) {
  // Pointer знаходиться зверху (-π/2)
  // Сегменти малюються починаючи зверху, коли rotation = 0
  // Позитивний rotation крутить колесо за годинниковою стрілкою
  let normalized = ((-rotation % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
  let index = Math.floor(normalized / segmentAngle) % segments;
  return index;
}

function spin() {
  if (isSpinning) return;
  isSpinning = true;
  spinBtn.disabled = true;
  resultDiv.classList.add('hidden');

  const extraSpins = 5 + Math.random() * 3; // 5-8 повних обертів
  const randomSegment = Math.floor(Math.random() * segments);
  const targetAngle = (randomSegment * segmentAngle) + (Math.random() * segmentAngle * 0.6) - Math.PI / 2;
  const totalRotation = extraSpins * 2 * Math.PI + targetAngle - currentRotation;

  const duration = 4500 + Math.random() * 1500;
  const startTime = performance.now();
  const startRotation = currentRotation;

  function animate(now) {
    const elapsed = now - startTime;
    const progress = Math.min(elapsed / duration, 1);
    // ease-out cubic
    const ease = 1 - Math.pow(1 - progress, 3);
    currentRotation = startRotation + totalRotation * ease;
    drawWheel(currentRotation);

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      isSpinning = false;
      spinBtn.disabled = false;
      const winnerIndex = getWinner(currentRotation);
      showResult(winnerIndex);
    }
  }
  requestAnimationFrame(animate);
}

function showResult(index) {
  resultNumber.textContent = `Випало: ${index + 1}`;
  resultQuestion.textContent = questions[index];
  resultDiv.classList.remove('hidden');
}

spinBtn.addEventListener('click', spin);

// Початкове малювання
drawWheel(0);
</script>
</body>
</html>
